name: Generate Activity Feed

on:
  push:
    paths:
      - 'data/*.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 10

      - name: Generate Smart Activity JSON
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            try {
              const commits = execSync('git log -n 15 --pretty=format:"%H|%an|%s|%cd" --date=iso data/').toString().split('\n');
              const activities = [];

              for (const line of commits) {
                if (!line) continue;
                const [hash, author, message, date] = line.split('|');

                // Skip automated bot commits
                if (author.includes('github-actions') || message.includes('skip ci')) continue;

                // Inspect files changed in this commit
                const diffFiles = execSync(`git show --name-only --oneline ${hash}`).toString().split('\n');
                const levelFiles = diffFiles.filter(f => f.startsWith('data/') && f.endsWith('.json') && !f.includes('activity.json') && !f.includes('editors.json'));

                for (const file of levelFiles) {
                  try {
                    const content = fs.readFileSync(file, 'utf8');
                    const levelData = JSON.parse(content);
                    const levelName = levelData.name || file.replace('data/', '').replace('.json', '');

                    // Format human-readable message based on commit intent
                    let customMessage = message;
                    if (message.toLowerCase().includes('add') || message.toLowerCase().includes('update')) {
                      if (levelData.records && levelData.records.length > 0) {
                        const lastRec = levelData.records[levelData.records.length - 1];
                        customMessage = `${lastRec.user} completed ${levelName} (${lastRec.percent}%)`;
                      } else {
                        customMessage = `${levelName} updated`;
                      }
                    } else if (message.toLowerCase().includes('place') || message.toLowerCase().includes('initial')) {
                      customMessage = `${levelName} was added to the list`;
                    }

                    activities.push({
                      id: hash.substring(0, 7) + '_' + levelName,
                      author: author,
                      message: customMessage,
                      date: date
                    });
                  } catch (e) {}
                }
              }

              // Deduplicate and take top 8
              const unique = Array.from(new Map(activities.map(item => [item['message'], item])).values()).slice(0, 8);
              fs.writeFileSync('./data/activity.json', JSON.stringify(unique, null, 2));
            } catch (err) {
              console.error(err);
            }

      - name: Commit activity.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update activity feed [skip ci]" && git push)
