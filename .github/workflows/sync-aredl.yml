name: Auto-Sync AREDL Rankings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Process AREDL Data
        run: |
          mkdir -p data
          
          python3 -c "
          import urllib.request
          import json

          # Fetch directly from AREDL's public GitHub raw mirrors to bypass API 403 blocks
          urls = [
              'https://raw.githubusercontent.com/All-Rated-Extreme-Demon-List/AREDL-ManagerV3/main/data/levels.json',
              'https://raw.githubusercontent.com/All-Rated-Extreme-Demon-List/guidelines/main/list.json',
              'https://aredl.net/api/arelist'
          ]

          mapping = {}
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      if response.status == 200:
                          raw = json.loads(response.read().decode())
                          levels = raw if isinstance(raw, list) else raw.get('data', raw.get('levels', []))
                          for idx, lvl in enumerate(levels):
                              gid = str(lvl.get('level_id') or lvl.get('gd_id') or lvl.get('id') or '')
                              pos = lvl.get('position') or lvl.get('rank') or (idx + 1)
                              if gid:
                                  mapping[gid] = pos
                          if mapping:
                              print(f'Successfully synced {len(mapping)} levels from {url}')
                              break
              except Exception as e:
                  print(f'Skipped {url}: {e}')

          # Ensure data/aredl.json is ALWAYS written so git add never fails
          with open('data/aredl.json', 'w') as f:
              json.dump(mapping, f, indent=2)
          "

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/aredl.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AREDL rankings [skip ci]" && git push)
