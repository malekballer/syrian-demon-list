<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="google-site-verification" content="MrMn-sa-_U4wbrg9E1OyGpQ6Sr-3mm1hzL7fa5eiXZE" />
        
        <base href="/syrian-demon-list/">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        
        <title>Syrian Demon List</title>
        <meta name="description" content="The official Syrian Demon List, ranking the hardest Geometry Dash levels completed by Syrian players." />

        <!-- Open Graph / Meta Tags -->
        <meta property="og:site_name" content="Syrian Demon List" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Syrian Demon List" />
        <meta property="og:description" content="The official Syrian Demon List, ranking the hardest Geometry Dash levels completed by Syrian players." />
        <meta property="og:url" content="https://malekballer.github.io/syrian-demon-list/" />
        <meta property="og:image" content="https://malekballer.github.io/syrian-demon-list/list_icon.png?v=2" />
        <meta name="theme-color" content="#b9a779" />

        <!-- Google Search Structured Data (Replaces 'GitHub Pages documentation' with 'Syrian Demon List') -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Syrian Demon List",
          "alternateName": ["SDL", "Syrian Demonlist"],
          "url": "https://malekballer.github.io/syrian-demon-list/"
        }
        </script>

        <!-- Favicons (48px+ resolutions satisfy Google Search snippet crawler) -->
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <link rel="icon" type="image/png" sizes="48x48" href="./list_icon.png" />
        <link rel="icon" type="image/png" sizes="96x96" href="./list_icon.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="./list_icon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="./list_icon.png" />
        <link rel="canonical" href="https://malekballer.github.io/syrian-demon-list/" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700;800&display=swap" rel="stylesheet" />

        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/tabs.css" />

        <!-- Supabase JS Client & Vue -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>

        <style>
            @font-face {
                font-family: 'Hayyakum Allah';
                src: url('https://syrian.zone/syid-assets/fonts/HayyakumAllah/WOFF/HayyakumAllah-Regular.woff') format('woff');
                font-weight: normal;
                font-style: normal;
            }

            html, body {
                margin: 0;
                padding: 0;
                height: 100vh;
                overflow: hidden;
            }

            a:focus,
            button:focus,
            .logo:focus {
                outline: none !important;
                box-shadow: none !important;
            }

            /* Unifies window scrolling on mobile so header & search bar stick */
            @media (max-width: 850px) {
                html, body, #app {
                    height: auto !important;
                    min-height: 100% !important;
                    overflow-x: clip !important;
                    overflow-y: auto !important;
                }

                #app > div[style*="flex-grow: 1"] {
                    overflow: visible !important;
                    height: auto !important;
                }
            }
        </style>
    </head>
    <body id="app" class="dark" style="display: flex; flex-direction: column;">
        
        <!-- HEADER (SLIM FLOATING BAR ON DESKTOP & MOBILE) -->
        <header class="dark">
            <!-- Logo Link (Clickable, no focus outline, custom Hayyakum Allah font) -->
            <router-link 
                to="/" 
                class="logo" 
                style="text-decoration: none; outline: none !important; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; position: relative; z-index: 50; pointer-events: auto;"
            >
                <img src="./list_icon.png" alt="List Logo" class="nav__logo" style="width: 38px; height: 38px; object-fit: contain;" />
                <h2 style="font-family: 'Hayyakum Allah', 'Lexend Deca', sans-serif !important; font-size: 1.9rem; font-weight: 400; margin: 0; color: #ffffff; transform: translateY(2px); line-height: 1;">Syrian Demon List</h2>
            </router-link>  

            <!-- Desktop Navigation Links (Hidden on Mobile) -->
            <nav class="nav desktop-nav">
                <router-link class="nav__tab" to="/list"
                    :class="{ active: (store.currentPath === '/list' || /^\/\d+$/.test(store.currentPath)) && store.currentPath !== '/' }">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard" :class="{ active: store.currentPath.startsWith('/leaderboard') }">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette" :class="{ active: store.currentPath.startsWith('/roulette') }">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link class="nav__tab" to="/rules" :class="{ active: store.currentPath.startsWith('/rules') }">
                    <span class="type-label-lg">Submission Rules</span>
                </router-link>
                <router-link v-if="store.profile && store.profile.is_editor === true" class="nav__tab" to="/review"
                    :class="{ active: store.currentPath.startsWith('/review') }">
                    <span class="type-label-lg" style="color: #b9a779;">Review Queue</span>
                </router-link>
            </nav>

            <!-- Desktop Actions (Hidden on Mobile) -->
            <div class="nav__actions desktop-actions">
                <a class="nav__icon" href="https://discord.gg/pPT7QK2cyv" target="_blank" title="Join Discord">
                    <img src="./assets/discord.svg" alt="Discord Logo" />
                </a>

                <button v-if="!store.user" @click="store.login()" class="nav__cta syrian-cta type-label-lg">
                    Login with Discord
                </button>

                <div v-else style="display: flex; align-items: center; gap: 0.5rem;">
                    <button @click="store.showProfileModal = true" class="nav__icon" title="Edit Profile">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: inherit; opacity: 0.85;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>
                    <button @click="store.showSubmissionModal = true" class="nav__cta syrian-cta type-label-lg">
                        Submit Record
                    </button>
                    <button @click="store.logout()" class="nav__icon" title="Logout">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: inherit; opacity: 0.85;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Hamburger Button ☰ (Visible on Mobile only <= 850px) -->
            <button class="mobile-hamburger-btn" @click="store.toggleMobileNav()" title="Menu">
                <svg v-if="!store.showMobileNav" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#edebe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <svg v-else width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b9a779" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>

        <!-- AREDL-STYLE SLIDE-OUT MOBILE DRAWER -->
        <div v-if="store.showMobileNav" class="mobile-drawer-overlay" @click="store.closeMobileNav()" @touchmove.prevent @wheel.prevent></div>
        <div class="mobile-drawer" :class="{ open: store.showMobileNav }">
            <div class="drawer-header">
                <router-link to="/" @click="store.closeMobileNav()" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none; cursor: pointer;">
                    <img src="./list_icon.png" alt="" style="width: 28px; height: 28px; object-fit: contain;" />
                    <span style="font-family: 'Lexend Deca', sans-serif; font-size: 1.1rem; font-weight: 400; color: #ffffff;">Syrian Demon List</span>
                </router-link>
                <button class="drawer-close-btn" @click="store.closeMobileNav()">✕</button>
            </div>

            <div class="drawer-links">
                <router-link to="/list" class="drawer-link" :class="{ active: store.currentPath === '/list' || /^\/\d+$/.test(store.currentPath) }">
                    DEMON LIST
                </router-link>
                <router-link to="/leaderboard" class="drawer-link" :class="{ active: store.currentPath.startsWith('/leaderboard') }">
                    LEADERBOARD
                </router-link>
                <router-link to="/roulette" class="drawer-link" :class="{ active: store.currentPath.startsWith('/roulette') }">
                    ROULETTE
                </router-link>
                <router-link to="/rules" class="drawer-link" :class="{ active: store.currentPath.startsWith('/rules') }">
                    SUBMISSION RULES
                </router-link>
                <router-link v-if="store.profile && store.profile.is_editor" to="/review" class="drawer-link" style="color: #b9a779 !important;">
                    REVIEW QUEUE
                </router-link>
            </div>

            <div class="drawer-divider"></div>

            <div class="drawer-actions">
                <button v-if="!store.user" @click="store.login()" class="syrian-cta drawer-btn">
                    Login with Discord
                </button>
                <template v-else>
                    <button @click="store.showSubmissionModal = true; store.closeMobileNav();" class="syrian-cta drawer-btn">
                        Submit Record
                    </button>
                    <button @click="store.showProfileModal = true; store.closeMobileNav();" class="drawer-outline-btn">
                        Edit Profile
                    </button>
                    <button @click="store.logout()" class="drawer-outline-btn" style="border-color: rgba(239,68,68,0.4); color: #ef4444;">
                        Logout
                    </button>
                </template>

                <a href="https://discord.gg/pPT7QK2cyv" target="_blank" class="drawer-discord-link">
                    <img src="./assets/discord.svg" alt="" style="width: 18px; height: 18px;" />
                    <span>Join Discord Server</span>
                </a>
            </div>
        </div>

        <!-- Main Page View Container -->
        <div style="flex-grow: 1; overflow-y: auto; overflow-x: hidden; width: 100%; box-sizing: border-box;">
            <router-view class="dark"></router-view>
        </div>

        <!-- Global Modals -->
        <submission-modal></submission-modal>
        <profile-modal></profile-modal>
    </body>
</html>
