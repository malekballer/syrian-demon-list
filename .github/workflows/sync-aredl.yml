name: Auto-Sync AREDL Rankings, Tags & Thumbnails

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AREDL Sync Script
        run: |
          python3 -c "
          import urllib.request
          import ssl
          import json
          import os

          os.makedirs('data', exist_ok=True)

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept': 'application/json'
          }

          url = 'https://api.aredl.net/v2/api/aredl/levels'
          mapping = {}

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, context=ctx, timeout=20) as response:
                  if response.status == 200:
                      raw = json.loads(response.read().decode('utf-8'))
                      levels = raw if isinstance(raw, list) else raw.get('levels', raw.get('data', []))
                      
                      for idx, lvl in enumerate(levels):
                          gid = str(lvl.get('level_id') or lvl.get('gd_id') or lvl.get('id') or '')
                          pos = lvl.get('position') or lvl.get('rank') or (idx + 1)
                          tags = lvl.get('tags', [])
                          
                          thumbnail = f'https://raw.githubusercontent.com/All-Rated-Extreme-Demon-List/Thumbnails/main/levels/full/{gid}.webp' if gid else ''
                          
                          if gid:
                              mapping[gid] = {
                                  'rank': pos, 
                                  'tags': tags,
                                  'thumbnail': thumbnail
                              }
                              
                      print(f'Successfully fetched {len(mapping)} levels with updated .webp thumbnails!')
          except Exception as e:
              print(f'Failed to fetch AREDL levels: {e}')

          if mapping:
              with open('data/aredl.json', 'w') as f:
                  json.dump(mapping, f, indent=2)
              print('data/aredl.json updated successfully.')
          "

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/aredl.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AREDL rankings, tags & thumbnails [skip ci]" && git push)
