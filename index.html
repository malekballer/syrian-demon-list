<!DOCTYPE html>
<html lang="en">
    <head>
        <base href="/syrian-demon-list/">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Syrian Demon List</title>

        <!-- Open Graph / Discord & Social Embed Meta Tags -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Syrian Demon List" />
        <meta property="og:title" content="Syrian Demon List" />
        <meta property="og:description" content="The official Syrian Demon List, ranking the hardest Geometry Dash levels completed by Syrian players." />
        <meta property="og:url" content="https://malekballer.github.io/syrian-demon-list/" />
        <meta property="og:image" content="https://malekballer.github.io/syrian-demon-list/list_icon.png" />
        <meta name="theme-color" content="#007A3D" />

        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Syrian Demon List" />
        <meta name="twitter:description" content="The official Syrian Demon List ranking the hardest Geometry Dash levels completed by Syrian players." />
        <meta name="twitter:image" content="https://malekballer.github.io/syrian-demon-list/list_icon.png" />

        <!-- Server icon -->
        <link rel="icon" href="./list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />

        <!-- Supabase JS Client library -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>

        <!-- Strict Active Navigation Highlight Styling -->
        <style>
            /* Reset default router active styles */
            .nav__tab.router-link-active,
            .nav__tab.router-link-exact-active {
                color: inherit;
                border-bottom: none;
                opacity: 0.7;
                font-weight: normal;
            }

            /* Apply highlight ONLY when custom active class is present */
            .nav__tab.active {
                color: #00FF80 !important;
                border-bottom: 2px solid #007A3D !important;
                opacity: 1 !important;
                font-weight: bold;
            }
        </style>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <img src="./list_icon.png" alt="List Logo" class="nav__logo" />
                <h2>Syrian Demon List</h2>
                <p>v1.5.0</p>
            </div>
            <nav class="nav">
                <router-link 
                    class="nav__tab" 
                    to="/" 
                    :class="{ active: store.currentPath === '/' || (!store.currentPath.startsWith('/leaderboard') && !store.currentPath.startsWith('/roulette') && !store.currentPath.startsWith('/rules')) }"
                >
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link 
                    class="nav__tab" 
                    to="/leaderboard" 
                    :class="{ active: store.currentPath.startsWith('/leaderboard') }"
                >
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link 
                    class="nav__tab" 
                    to="/roulette" 
                    :class="{ active: store.currentPath.startsWith('/roulette') }"
                >
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link 
                    class="nav__tab" 
                    to="/rules" 
                    :class="{ active: store.currentPath.startsWith('/rules') }"
                >
                    <span class="type-label-lg">Submission Rules</span>
                </router-link>
            </nav>
            <div class="nav__actions">
                <button
                    class="nav__icon"
                    @click.prevent="store.toggleDark()"
                >
                    <img
                        :src="store.dark ? './assets/light.svg' : './assets/dark.svg'"
                        alt=""
                    />
                </button>
                <!-- Discord invite link -->
                <a class="nav__icon" href="https://discord.gg/pPT7QK2cyv" target="_blank">
                    <img src="./assets/discord.svg" alt="Discord Logo" />
                </a>
                <!-- List record submission form -->
                <a
                    class="nav__cta type-label-lg"
                    href="https://forms.gle/vFNdUoCBnFSg3rLu7"
                    target="_blank"
                    >Submit Record</a
                >
            </div>
        </header>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
