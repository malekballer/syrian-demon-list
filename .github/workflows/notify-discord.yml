name: Notify Discord of list changes

on:
  push:
    branches: [main]
    paths:
      - "data/list.json"
  workflow_dispatch:
    inputs:
      list_file:
        description: "Path to the ordered list JSON file (leave blank to use data/list.json)"
        required: false
      compare_ref:
        description: "Git ref to diff against, e.g. a commit SHA (leave blank to auto-detect the previous commit)"
        required: false
      data_dir:
        description: "Folder with one JSON file per level (used for display names, optional)"
        required: false
        default: "data"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history so `compare_ref` can resolve

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run notifier
        env:
          # On a push event, LIST_FILE/COMPARE_REF default to "the file that
          # changed" / "what it looked like right before this push". A manual
          # run can override either (e.g. to re-diff against an older commit).
          LIST_FILE: ${{ inputs.list_file || 'data/list.json' }}
          COMPARE_REF: ${{ inputs.compare_ref || github.event.before || 'HEAD~1' }}
          DATA_DIR: ${{ inputs.data_dir || 'data' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord.mjs
