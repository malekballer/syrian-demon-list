name: Generate Activity Feed

on:
  push:
    paths:
      - 'data/list.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 100

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate Changelog
        run: node scripts/generate-activity.mjs

      - name: Commit activity.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update changelog feed [skip ci]" && git push)