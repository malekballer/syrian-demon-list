name: Auto-Sync AREDL Rankings and Tags

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Process AREDL Data & Tags
        run: |
          mkdir -p data
          
          python3 -c "
          import urllib.request
          import json
          import time

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept': 'application/json'
          }

          mapping = {}

          # 1. Fetch main AREDL list
          list_url = 'https://api.aredl.net/v2/api/aredl/list'
          try:
              req = urllib.request.Request(list_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  if response.status == 200:
                      levels = json.loads(response.read().decode())
                      for idx, lvl in enumerate(levels):
                          gid = str(lvl.get('level_id') or lvl.get('gd_id') or lvl.get('id') or '')
                          pos = lvl.get('position') or lvl.get('rank') or (idx + 1)
                          if gid:
                              mapping[gid] = {'rank': pos, 'tags': []}
                      print(f'Successfully fetched {len(mapping)} levels from list.')
          except Exception as e:
              print(f'Failed to fetch main list: {e}')

          # 2. Fetch tags for each level
          for gid in list(mapping.keys()):
              detail_url = f'https://api.aredl.net/v2/api/aredl/levels/{gid}'
              try:
                  req = urllib.request.Request(detail_url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      if resp.status == 200:
                          detail = json.loads(resp.read().decode())
                          mapping[gid]['tags'] = detail.get('tags', [])
              except Exception as e:
                  print(f'Could not fetch tags for {gid}: {e}')
              time.sleep(0.05) # Polite delay to avoid hitting rate limits

          # Save mapped dictionary to data/aredl.json
          with open('data/aredl.json', 'w') as f:
              json.dump(mapping, f, indent=2)
          "

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/aredl.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AREDL rankings and tags [skip ci]" && git push)
