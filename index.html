<!DOCTYPE html>
<html lang="en">
    <head>
        <base href="/syrian-demon-list/">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Syrian Demon List</title>

        <!-- Open Graph / Discord & Social Embed Meta Tags -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Syrian Demon List" />
        <meta property="og:title" content="Syrian Demon List" />
        <meta property="og:description" content="The official Syrian Demon List, ranking the hardest Geometry Dash levels completed by Syrian players." />
        <meta property="og:url" content="https://malekballer.github.io/syrian-demon-list/" />
        <meta property="og:image" content="https://malekballer.github.io/syrian-demon-list/assets/list_icon.png" />
        <meta name="theme-color" content="#b9a779" />

        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Syrian Demon List" />
        <meta name="twitter:description" content="The official Syrian Demon List ranking the hardest Geometry Dash levels completed by Syrian players." />
        <meta name="twitter:image" content="https://malekballer.github.io/syrian-demon-list/assets/syria%20dneib.png" />

        <!-- Server icon -->
        <link rel="icon" href="./list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />

        <!-- Supabase JS Client library -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>

        <!-- Strict Active Navigation Highlight & Custom CTA Styling -->
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100vh;
                overflow: hidden;
            }

            header {
                height: 4.5rem !important;
                min-height: 4.5rem !important;
                max-height: 4.5rem !important;
                flex-shrink: 0 !important;
                width: calc(100% - 3rem) !important;
                margin: 0.75rem auto 0 1.875rem !important;
                border-radius: 12px;
                box-sizing: border-box !important;
            }

            /* Responsive fix for mobile: let the header adapt naturally without forced shrinking */
            @media (max-width: 900px) {
                html, body {
                    height: auto !important;
                    overflow: auto !important;
                }
                header {
                    height: auto !important;
                    min-height: auto !important;
                    max-height: none !important;
                    width: 100% !important;
                    margin: 0 !important;
                    border-radius: 0 !important;
                    flex-direction: column !important;
                    padding: 1rem !important;
                    gap: 0.75rem;
                }
                div[style*="overflow-y: auto"] {
                    height: auto !important;
                    overflow: visible !important;
                }
            }

            .nav__tab.router-link-active,
            .nav__tab.router-link-exact-active {
                color: inherit;
                border-bottom: none;
                opacity: 0.75;
                font-weight: normal;
            }

            .nav__tab.active {
                color: #b9a779 !important;
                border-bottom: 2px solid #b9a779 !important;
                opacity: 1 !important;
                font-weight: bold;
            }

            .syrian-cta {
                background: linear-gradient(135deg, #c0a25c 0%, #b9a779 100%) !important;
                color: #002623 !important;
                font-weight: 800 !important;
                border: none !important;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(185, 167, 121, 0.35);
                transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            }

            .syrian-cta:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(185, 167, 121, 0.5);
                filter: brightness(1.05);
            }

            .syrian-cta:active {
                transform: translateY(0);
            }
        </style>
    </head>
    <body id="app" class="dark" style="display: flex; flex-direction: column;">
        <header class="dark">
            <router-link to="/" class="logo" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem; cursor: pointer;">
                <img src="./list_icon.png" alt="List Logo" class="nav__logo" />
                <h2 style="color: inherit;">Syrian Demon List</h2>
                <p>v2.0</p>
            </router-link>
            <nav class="nav">
                <router-link class="nav__tab" to="/list"
                    :class="{ active: (store.currentPath === '/list' || /^\/\d+$/.test(store.currentPath)) && store.currentPath !== '/' }">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard" :class="{ active: store.currentPath.startsWith('/leaderboard') }">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette" :class="{ active: store.currentPath.startsWith('/roulette') }">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link class="nav__tab" to="/rules" :class="{ active: store.currentPath.startsWith('/rules') }">
                    <span class="type-label-lg">Submission Rules</span>
                </router-link>
                <router-link v-if="store.profile && store.profile.is_editor === true" class="nav__tab" to="/review"
                    :class="{ active: store.currentPath.startsWith('/review') }">
                    <span class="type-label-lg" style="color: #b9a779;">Review Queue</span>
                </router-link>
            </nav>
            <div class="nav__actions">
                <!-- Discord Invite Link -->
                <a class="nav__icon" href="https://discord.gg/pPT7QK2cyv" target="_blank">
                    <img src="./assets/discord.svg" alt="Discord Logo" />
                </a>

                <!-- Logged Out: Login CTA -->
                <button 
                    v-if="!store.user" 
                    @click="store.login()" 
                    class="nav__cta syrian-cta type-label-lg"
                >
                    Login with Discord
                </button>

                <!-- Logged In Actions -->
                <div v-else style="display: flex; align-items: center; gap: 0.5rem;">
                    <button 
                        @click="store.showProfileModal = true" 
                        class="nav__icon"
                        title="Edit Profile"
                        style="cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center;"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: inherit; opacity: 0.85;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>

                    <button 
                        @click="store.showSubmissionModal = true" 
                        class="nav__cta syrian-cta type-label-lg"
                    >
                        Submit Record
                    </button>
                    
                    <button 
                        @click="store.logout()" 
                        class="nav__icon"
                        title="Logout"
                        style="cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center;"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: inherit; opacity: 0.85;">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Scrollable container for page views so the scrollbar starts below the header -->
        <div style="flex-grow: 1; overflow-y: auto; overflow-x: hidden; width: 100%; box-sizing: border-box;">
            <router-view class="dark"></router-view>
        </div>

        <!-- Global Modals -->
        <submission-modal></submission-modal>
        <profile-modal></profile-modal>
    </body>
</html>
