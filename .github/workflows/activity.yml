name: Generate Activity Feed

on:
  push:
    paths:
      - 'data/*.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 15

      - name: Generate Smart Activity JSON
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            try {
              // Get recent commits modifying level JSON files
              const logOutput = execSync('git log -n 15 --pretty=format:"%H|%an|%s|%cd" --date=iso data/').toString();
              const commits = logOutput.split('\n');
              const activities = [];

              for (const line of commits) {
                if (!line) continue;
                const [hash, author, message, date] = line.split('|');

                // Skip automated bot actions
                if (author.includes('github-actions') || message.includes('skip ci')) continue;

                // Find updated level files in this commit
                const diffFiles = execSync(`git show --name-only --oneline ${hash}`).toString().split('\n');
                const levelFiles = diffFiles.filter(f => f.startsWith('data/') && f.endsWith('.json') && !f.includes('activity.json') && !f.includes('editors.json'));

                for (const file of levelFiles) {
                  if (!fs.existsSync(file)) continue;

                  try {
                    const content = fs.readFileSync(file, 'utf8');
                    const levelData = JSON.parse(content);
                    const levelName = levelData.name || file.replace('data/', '').replace('.json', '');

                    let formattedMessage = '';

                    // Check if a record exists
                    if (levelData.records && levelData.records.length > 0) {
                      // Grab the most recently added record entry
                      const latestRecord = levelData.records[levelData.records.length - 1];
                      if (latestRecord.percent === 100) {
                        formattedMessage = `${latestRecord.user} completed ${levelName} (100%)`;
                      } else {
                        formattedMessage = `${latestRecord.user} achieved ${latestRecord.percent}% on ${levelName}`;
                      }
                    } else if (levelData.verifier) {
                      formattedMessage = `${levelName} was added (Verified by ${levelData.verifier})`;
                    } else {
                      formattedMessage = `${levelName} was updated on the list`;
                    }

                    activities.push({
                      id: hash.substring(0, 7) + '_' + Math.random().toString(36).substring(2, 5),
                      author: author,
                      message: formattedMessage,
                      date: date
                    });
                  } catch (e) {
                    console.error('Error reading file:', file, e);
                  }
                }
              }

              // Filter duplicates and save top 8 items
              const unique = Array.from(new Map(activities.map(item => [item['message'], item])).values()).slice(0, 8);
              
              if (unique.length > 0) {
                fs.writeFileSync('./data/activity.json', JSON.stringify(unique, null, 2));
              }
            } catch (err) {
              console.error('Workflow error:', err);
            }

      - name: Commit activity.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update activity feed [skip ci]" && git push)
